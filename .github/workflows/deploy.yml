name: Update RSS and deploy Editorial Hub
on:
  push:
    branches: [main]
    paths-ignore:
      - "feed.json"
      - "feed-data.js"
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch RSS feeds
        run: python scripts/fetch_feeds.py
        continue-on-error: true
      - name: Ensure feed JSON exists and is valid
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('feed.json')
          if not path.exists():
              path.write_text(json.dumps({'updated': 'Feed generator unavailable', 'articles': [], 'health': {'working_feeds': 0, 'configured_feeds': 0, 'failed_feeds': 0, 'article_count': 0}}, ensure_ascii=False, indent=2), encoding='utf-8')
          data = json.loads(path.read_text(encoding='utf-8'))
          if not isinstance(data.get('articles'), list):
              raise SystemExit('feed.json has an invalid articles field')
          print('feed.json ready:', len(data['articles']), 'articles')
          PY
      - name: Validate inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>([\\s\\S]*?)</script>", html)
          Path("/tmp/editorial-hub-inline.js").write_text("\\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/editorial-hub-inline.js
      - name: Build embedded browser feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("feed.json").read_text(encoding="utf-8"))
          bundle = "window.EDITORIAL_HUB_FEED = " + json.dumps(data, ensure_ascii=False, separators=(",", ":")) + ";\\n"
          Path("feed-data.js").write_text(bundle, encoding="utf-8")
          print("Embedded", len(data.get("articles", [])), "articles into feed-data.js")
          PY
      - name: Publish generated feed for browser access
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json feed-data.js
          if git diff --cached --quiet; then
            echo "Feed unchanged; no commit needed."
          else
            git commit -m "Update generated news feed"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
